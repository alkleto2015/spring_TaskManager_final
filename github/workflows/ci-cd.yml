name: CI/CD Pipeline

on:
  push:
    branches: [ "dev" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      #скачаємо код з репозиторія
      - name: Checkout code
        uses: actions/checkout@v4

      # Установимо Java 21(на якій розробляється додаток)
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      #запускаємо тести (стадія test)
      - name: Run Tests
        run: mvn test

      #збираємо JAR-файл (стадія build)
      - name: Build JAR
        run: mvn clean package -DskipTests

      #Авторизація в Docker Hub через секрети, котрі ми зробили на GitHub
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

        # збірка пуш та автоматична публікація Docker-образа в мій репозиторій
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            alkleto2015/spring-taskmanager-final:latest
            alkleto2015/spring-taskmanager-final:${{ github.sha }}